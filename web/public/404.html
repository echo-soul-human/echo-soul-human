<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>星回</title>
  <meta name="robots" content="noindex" />
  <script>
    /*
      GitHub Pages 不做 rewrite，刷新 /<base>/chat/<id> 这类子路由会 404。
      这里的做法：把真实 path 与 query 编码进 hash，再跳回 index.html，
      由应用启动时还原路由。

      为什么不用 hash 路由：URL 会变丑，而且分享链接的归因参数
      （?from=share:<id>）会一起被污染，而分享图落地页是本产品的主增长钩子。
      见 docs/分册-网页端.md §15。
    */
    (function () {
      var l = window.location;
      var segs = l.pathname.split('/').filter(Boolean);
      // 仓库名固定是第一段；剩下的是应用内路由
      var appPath = segs.length > 1 ? '/' + segs.slice(1).join('/') : '/';
      var target = l.origin + '/' + segs[0] + '/'
        + '#r=' + encodeURIComponent(appPath + l.search + l.hash.replace(/^#/, ''));
      l.replace(target);
    })();
  </script>
</head>
<body>
  <p>正在跳转…</p>
</body>
</html>
