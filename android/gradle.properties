# Gradle 守护进程参数。-Xmx 保守取值：低端开发机与 CI runner 上
# KSP + Compose 同时跑会吃很多堆，OOM 时报错信息还不直观。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 配置期不解析每个任务的依赖（AGP 已默认开启，显式写出防被覆盖）
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room schema 导出到 app/schemas/ 并纳入版本控制：Migration 测试要读它
ksp.incremental=true
